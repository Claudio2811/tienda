<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout · Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="demo-banner" style="display:none">
    🎭 <strong>MODO DEMO</strong> — Pagos no son reales.
  </div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand">Tienda<span>.</span></a>
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/productos.html">Productos</a></li>
      </ul>
      <a href="/carrito.html" class="cart-btn">🛒 Carrito <span class="cart-count">0</span></a>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h1 style="font-size:32px;margin-bottom:24px">Finalizar compra</h1>

      <div class="alert alert-info" id="demo-msg" style="display:none">
        🎭 <strong>Modo demo activo</strong> — Tu pedido se creará en la base de datos pero no se procesará pago real.
      </div>

      <form id="checkout-form" class="form" style="max-width:720px;margin:0 auto">
        <h3 style="font-family:'Inter',sans-serif;font-size:16px;font-weight:600;margin-bottom:8px;margin-top:8px">Datos de contacto</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Nombre completo *</label>
            <input type="text" name="customer_nombre" required />
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" name="customer_email" required />
          </div>
        </div>
        <div class="form-group">
          <label>Teléfono *</label>
          <input type="tel" name="customer_telefono" required placeholder="+56 9 XXXX XXXX" />
        </div>

        <h3 style="font-family:'Inter',sans-serif;font-size:16px;font-weight:600;margin-bottom:8px;margin-top:24px">Dirección de envío</h3>
        <div class="form-group">
          <label>Dirección *</label>
          <input type="text" name="customer_direccion" required placeholder="Calle, número, depto" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Comuna</label>
            <input type="text" name="customer_comuna" />
          </div>
          <div class="form-group">
            <label>Región</label>
            <input type="text" name="customer_region" />
          </div>
        </div>
        <div class="form-group">
          <label>Notas para el envío (opcional)</label>
          <textarea name="notas" rows="3" placeholder="Indicaciones especiales..."></textarea>
        </div>

        <h3 style="font-family:'Inter',sans-serif;font-size:16px;font-weight:600;margin-bottom:8px;margin-top:24px">Resumen</h3>
        <div class="cart-summary" style="position:static">
          <div id="order-summary"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px" id="submit-btn">Confirmar pedido</button>
          <a href="/carrito.html" style="display:block;text-align:center;margin-top:12px;font-size:14px;color:var(--ink-soft)">← Volver al carrito</a>
        </div>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">© 2026 Tienda</div>
    </div>
  </footer>

  <script src="/app.js"></script>
  <script>
    const isDemo = new URLSearchParams(location.search).get('demo') === '1';
    if (isDemo) document.getElementById('demo-msg').style.display = 'block';

    function renderSummary() {
      const subtotal = cartTotal();
      const envio = subtotal >= 50000 ? 0 : 3990;
      const total = subtotal + envio;
      document.getElementById('order-summary').innerHTML = `
        <div class="cart-line"><span>Subtotal (${TIENDA.cart.reduce((s,i)=>s+i.cantidad,0)} items)</span><span>${formatCLP(subtotal)}</span></div>
        <div class="cart-line"><span>Envío</span><span>${envio === 0 ? 'Gratis' : formatCLP(envio)}</span></div>
        <div class="cart-line total"><span>Total</span><span>${formatCLP(total)}</span></div>
      `;
    }
    renderSummary();

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (TIENDA.cart.length === 0) { alert('Tu carrito está vacío'); return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Procesando...';

      const fd = new FormData(e.target);
      const data = {
        customer_nombre: fd.get('customer_nombre'),
        customer_email: fd.get('customer_email'),
        customer_telefono: fd.get('customer_telefono'),
        customer_direccion: fd.get('customer_direccion'),
        customer_comuna: fd.get('customer_comuna'),
        customer_region: fd.get('customer_region'),
        notas: fd.get('notas'),
        items: TIENDA.cart.map(i => ({ producto_id: i.id, cantidad: i.cantidad })),
        is_demo: isDemo
      };
      const subtotal = cartTotal();
      data.envio = subtotal >= 50000 ? 0 : 3990;

      try {
        const r = await api('/orders', { method: 'POST', body: data });
        clearCart();
        location.href = '/gracias.html?codigo=' + encodeURIComponent(r.pedido.codigo) + (isDemo ? '&demo=1' : '');
      } catch (err) {
        alert('Error al crear el pedido: ' + err.message);
        btn.disabled = false; btn.textContent = 'Confirmar pedido';
      }
    });
  </script>
</body>
</html>
